services:
  nginx:
    image: nginx:latest
    container_name: saam-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - saam-backend
      - saam-frontend
    networks:
      - saam-network

  saam-frontend:
    image: ardilan13/saam:frontend
    container_name: saam-frontend
    restart: always
    networks:
      - saam-network

  saam-backend:
    image: ardilan13/saam:backend
    container_name: saam-backend
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - APP_DATABASE_URI=${APP_DATABASE_URI}
      - MAILTRAP_HOST=${MAILTRAP_HOST}
      - MAILTRAP_TOKEN=${MAILTRAP_TOKEN}
      - MAILTRAP_SENDER_NAME=${MAILTRAP_SENDER_NAME}
      - MAILTRAP_SENDER_EMAIL=${MAILTRAP_SENDER_EMAIL}
      - DAYJS_START=${DAYJS_START}
      - DAYJS_END=${DAYJS_END}
      - ACADEMIC_YEAR=${ACADEMIC_YEAR}
      - ACADEMIC_TERM=${ACADEMIC_TERM}
    networks:
      - saam-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=6000 # cada hora
    networks:
      - saam-network

networks:
  saam-network:
    driver: bridge
